<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard de Despesas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="topbar">
  <h1>Despesas</h1>
</header>

<main class="container">

  <!-- FORMULÁRIO DE INCLUSÃO -->
  <section class="card">
    <h3>Nova despesa</h3>

    <div class="form-grid">
      <input id="nome" placeholder="Descrição">
      <input id="valor" type="number" placeholder="Valor">

      <select id="parcelado">
        <option value="nao">À vista</option>
        <option value="sim">Parcelado</option>
      </select>

      <input id="parcelas" type="number" placeholder="Parcelas" disabled>

      <input id="mes" type="month">

      <select id="categoria">
        <option>Moradia</option>
        <option>Saúde</option>
        <option>Educação</option>
        <option>Alimentação</option>
        <option>Transporte</option>
        <option>Outros</option>
      </select>
    </div>

    <button id="add-btn">Adicionar despesa</button>
  </section>

  <!-- CONTROLES DO GRÁFICO -->
  <section class="chart-controls">
    <input type="month" id="month-filter">
    <button id="toggle-chart">Trocar gráfico</button>
  </section>

  <!-- GRÁFICO -->
  <section class="card">
    <canvas id="chart"></canvas>
  </section>

</main>

<!-- MODAL DE EDIÇÃO -->
<div id="edit-modal" class="modal hidden">
  <div class="modal-content">
    <h3>Editar despesa</h3>

    <label>Descrição</label>
    <input id="edit-nome">

    <label>Valor</label>
    <input type="number" id="edit-valor">

    <label>Parcelas</label>
    <input type="number" id="edit-parcelas">

    <label>Categoria</label>
    <select id="edit-categoria">
      <option>Moradia</option>
      <option>Saúde</option>
      <option>Educação</option>
      <option>Alimentação</option>
      <option>Transporte</option>
      <option>Outros</option>
    </select>

    <div class="modal-actions">
      <button id="save-edit">Salvar</button>
      <button id="delete-edit" class="danger">Excluir</button>
      <button id="cancel-edit">Cancelar</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
